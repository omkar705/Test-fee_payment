<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="payment-flow.css">
</head>
<body>
<div class="background-globes"><div class="globe globe-1"></div><div class="globe globe-2"></div><div class="globe globe-3"></div></div>
<main class="app-container">
<div class="card glass-card fade-in payment-flow-card">
    <div class="success-wrap">
        <div class="success-mark">✓</div>
        <h1 class="flow-title">Payment Successful!</h1>
        <p class="flow-subtitle">Your student fee payment has been completed successfully.</p>
        <div id="amount" class="success-amount">₹5,050.00</div>

        <div class="detail-box">
            <div class="detail-row"><span>Transaction ID</span><strong id="transactionId">Loading...</strong></div>
            <div class="detail-row"><span>Payment ID</span><strong id="paymentId">-</strong></div>
            <div class="detail-row"><span>Payment Method</span><strong id="paymentMethod">-</strong></div>
            <div class="detail-row"><span>Gateway</span><strong id="gatewayName">Razorpay</strong></div>
            <div class="detail-row"><span>Status</span><strong class="status-success">SUCCESS</strong></div>
            <div class="detail-row"><span>Date</span><strong id="transactionDate">-</strong></div>
        </div>

        <a id="receiptButton" class="btn btn-success btn-full" href="#">View Receipt</a>
    </div>
</div>
</main>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("transactionId");

    if (!id) {
        window.location.href = "payment-failed.html";
        return;
    }

    try {
        const response = await fetch("/api/payments/transactions/" + encodeURIComponent(id));
        if (!response.ok) throw new Error("Transaction could not be loaded.");

        const t = await response.json();
        document.getElementById("transactionId").textContent = t.transactionReference || ("#" + t.transactionId);
        document.getElementById("paymentId").textContent = t.paymentId ?? "-";
        document.getElementById("gatewayName").textContent = t.gatewayName || "Razorpay";
        document.getElementById("paymentMethod").textContent =
            sessionStorage.getItem("paymentMethod") === "upi" ? "UPI / Instant Pay" :
            sessionStorage.getItem("paymentMethod") === "netbanking" ? "Net Banking" : "Credit / Debit Card";
        document.getElementById("amount").textContent =
            "₹" + Number(t.amount || 0).toLocaleString("en-IN", {minimumFractionDigits: 2});
        document.getElementById("transactionDate").textContent =
            t.transactionDate ? new Date(t.transactionDate).toLocaleString("en-IN") : new Date().toLocaleString("en-IN");

        document.getElementById("receiptButton").href =
            "receipt.html?transactionId=" + encodeURIComponent(t.transactionId);
    } catch (error) {
        document.getElementById("transactionId").textContent = "Unavailable";
        document.getElementById("receiptButton").classList.add("hidden");
    }
});
</script>
</body>
</html>
